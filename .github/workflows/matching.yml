name: Matching Lambda
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: matching-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      MATCHING_LAMBDA_NAME: ${{ vars.MATCHING_LAMBDA_NAME || secrets.MATCHING_LAMBDA_NAME }}
      MATCHING_DATABASE_URL: ${{ secrets.MATCHING_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install packaging dependencies
        run: python -m pip install -r matching/requirements.txt
      - name: Update existing Lambda
        run: python -m matching.deploy
