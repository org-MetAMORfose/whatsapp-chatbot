name: CD
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: "Deploying to Lightsail"
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 15
    permissions:
      contents: read

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Wait for SSH
        run: |
          echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key

          for i in $(seq 1 30); do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 \
              -i /tmp/ssh_key \
              ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }} "echo ok"; then
              echo "SSH connection established"
              rm -f /tmp/ssh_key
              exit 0
            fi
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done

          rm -f /tmp/ssh_key
          echo "SSH connection failed after 30 attempts"
          exit 1

      # 3. SCP dos arquivos para a pasta no servidor
      - name: Remove .git before copy
        run: rm -rf .git

      - name: Copy files to Lightsail
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: "."
          target: ${{ secrets.LIGHTSAIL_APP_PATH }}
          rm: false
          overwrite: true

      - name: Write .env and deploy
        uses: appleboy/ssh-action@v1.0.3

        env:
          MATCHING_LAMBDA_NAME: ${{ vars.MATCHING_LAMBDA_NAME || secrets.MATCHING_LAMBDA_NAME }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

          LIGHTSAIL_APP_PATH: ${{ secrets.LIGHTSAIL_APP_PATH }}

          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_ENDPOINT: ${{ secrets.LANGSMITH_ENDPOINT }}
          LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}
          LANGSMITH_TRACING: ${{ secrets.LANGSMITH_TRACING }}

          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          CHATBOT_API_KEY: ${{ secrets.CHATBOT_API_KEY }}
          FAQ_RETRIEVAL_LIMIT: ${{ secrets.FAQ_RETRIEVAL_LIMIT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_EMBEDDING_MODEL: ${{ secrets.OPENAI_EMBEDDING_MODEL }}
          OPENAI_RESPONSE_MODEL: ${{ secrets.OPENAI_RESPONSE_MODEL }}

          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_USERNAME: ${{ secrets.REDIS_USERNAME }}

          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}


          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}

          GOOGLE_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_CREDENTIALS }}
          GOOGLE_PATIENTS_SPREADSHEET_URL: ${{ secrets.GOOGLE_PATIENTS_SPREADSHEET_URL }}
          GOOGLE_PROFESSIONALS_SPREADSHEET_URL: ${{ secrets.GOOGLE_PROFESSIONALS_SPREADSHEET_URL }}

          GMAIL_ID_CLIENT: ${{ secrets.GMAIL_ID_CLIENT }}
          GMAIL_SECRET_CLIENT: ${{ secrets.GMAIL_SECRET_CLIENT }}

          # Acolhimento imediato (Pix do Banco do Brasil, sala de vídeo no Daily)
          IMMEDIATE_CARE_ENABLED: ${{ vars.IMMEDIATE_CARE_ENABLED || 'false' }}
          PIX_PROVIDER: ${{ vars.PIX_PROVIDER || 'fake' }}
          BB_PIX_CLIENT_ID: ${{ secrets.BB_PIX_CLIENT_ID }}
          BB_PIX_CLIENT_SECRET: ${{ secrets.BB_PIX_CLIENT_SECRET }}
          BB_PIX_DEV_APP_KEY: ${{ secrets.BB_PIX_DEV_APP_KEY }}
          BB_PIX_CHAVE: ${{ secrets.BB_PIX_CHAVE }}
          BB_PIX_BASE_URL: ${{ vars.BB_PIX_BASE_URL || 'https://api-pix.hm.bb.com.br/pix/v2' }}
          BB_PIX_OAUTH_URL: ${{ vars.BB_PIX_OAUTH_URL || 'https://oauth.hm.bb.com.br/oauth/token' }}
          PIX_WEBHOOK_TOKEN: ${{ secrets.PIX_WEBHOOK_TOKEN }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL || 'https://chatbot.orgmetamorfose.com.br' }}
          IMMEDIATE_PRICE_30_CENTS: ${{ vars.IMMEDIATE_PRICE_30_CENTS || '6000' }}
          IMMEDIATE_PRICE_50_CENTS: ${{ vars.IMMEDIATE_PRICE_50_CENTS || '9000' }}
          IMMEDIATE_OFFER_TIMEOUT_SECONDS: ${{ vars.IMMEDIATE_OFFER_TIMEOUT_SECONDS || '300' }}
          IMMEDIATE_PAYMENT_TIMEOUT_SECONDS: ${{ vars.IMMEDIATE_PAYMENT_TIMEOUT_SECONDS || '1800' }}
          IMMEDIATE_ROOM_GRACE_MINUTES: ${{ vars.IMMEDIATE_ROOM_GRACE_MINUTES || '15' }}
          DAILY_API_KEY: ${{ secrets.DAILY_API_KEY }}

        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}

          envs: MATCHING_LAMBDA_NAME,LIGHTSAIL_APP_PATH,S3_BUCKET_NAME,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_REGION,LANGSMITH_API_KEY,LANGSMITH_ENDPOINT,LANGSMITH_PROJECT,LANGSMITH_TRACING,LOG_LEVEL,CHATBOT_API_KEY,FAQ_RETRIEVAL_LIMIT,OPENAI_API_KEY,OPENAI_EMBEDDING_MODEL,OPENAI_RESPONSE_MODEL,REDIS_PASSWORD,REDIS_USERNAME,POSTGRES_USER,POSTGRES_PASSWORD,WHATSAPP_ACCESS_TOKEN,WHATSAPP_PHONE_NUMBER_ID,WHATSAPP_VERIFY_TOKEN,GOOGLE_SERVICE_ACCOUNT_CREDENTIALS,GOOGLE_PATIENTS_SPREADSHEET_URL,GOOGLE_PROFESSIONALS_SPREADSHEET_URL,GMAIL_ID_CLIENT,GMAIL_SECRET_CLIENT,IMMEDIATE_CARE_ENABLED,PIX_PROVIDER,BB_PIX_CLIENT_ID,BB_PIX_CLIENT_SECRET,BB_PIX_DEV_APP_KEY,BB_PIX_CHAVE,BB_PIX_BASE_URL,BB_PIX_OAUTH_URL,PIX_WEBHOOK_TOKEN,PUBLIC_BASE_URL,IMMEDIATE_PRICE_30_CENTS,IMMEDIATE_PRICE_50_CENTS,IMMEDIATE_OFFER_TIMEOUT_SECONDS,IMMEDIATE_PAYMENT_TIMEOUT_SECONDS,IMMEDIATE_ROOM_GRACE_MINUTES,DAILY_API_KEY

          script: |
            set -e

            cd "$LIGHTSAIL_APP_PATH"

            cat > .env << EOF
            MATCHING_LAMBDA_NAME=$MATCHING_LAMBDA_NAME
            S3_BUCKET_NAME=$S3_BUCKET_NAME
            AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
            AWS_REGION=$AWS_REGION

            DATABASE_URL=postgresql+psycopg://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres:5432/chatbot

            LANGSMITH_API_KEY=$LANGSMITH_API_KEY
            LANGSMITH_ENDPOINT=$LANGSMITH_ENDPOINT
            LANGSMITH_PROJECT=$LANGSMITH_PROJECT
            LANGSMITH_TRACING=$LANGSMITH_TRACING
            LOG_LEVEL=$LOG_LEVEL
            CHATBOT_API_KEY=$CHATBOT_API_KEY
            FAQ_RETRIEVAL_LIMIT=$FAQ_RETRIEVAL_LIMIT
            OPENAI_API_KEY=$OPENAI_API_KEY
            OPENAI_EMBEDDING_MODEL=$OPENAI_EMBEDDING_MODEL
            OPENAI_RESPONSE_MODEL=$OPENAI_RESPONSE_MODEL
            REDIS_DB=0
            REDIS_HOST=redis
            REDIS_PASSWORD=$REDIS_PASSWORD
            REDIS_PORT=6379
            REDIS_USERNAME=$REDIS_USERNAME

            POSTGRES_USER=$POSTGRES_USER
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            POSTGRES_DB=chatbot

            WHATSAPP_ACCESS_TOKEN=$WHATSAPP_ACCESS_TOKEN
            WHATSAPP_PHONE_NUMBER_ID=$WHATSAPP_PHONE_NUMBER_ID
            WHATSAPP_VERIFY_TOKEN=$WHATSAPP_VERIFY_TOKEN
            GOOGLE_SERVICE_ACCOUNT_CREDENTIALS=$GOOGLE_SERVICE_ACCOUNT_CREDENTIALS
            GOOGLE_PATIENTS_SPREADSHEET_URL=$GOOGLE_PATIENTS_SPREADSHEET_URL
            GOOGLE_PROFESSIONALS_SPREADSHEET_URL=$GOOGLE_PROFESSIONALS_SPREADSHEET_URL

            GMAIL_ID_CLIENT=$GMAIL_ID_CLIENT
            GMAIL_SECRET_CLIENT=$GMAIL_SECRET_CLIENT

            IMMEDIATE_CARE_ENABLED=$IMMEDIATE_CARE_ENABLED
            PIX_PROVIDER=$PIX_PROVIDER
            BB_PIX_CLIENT_ID=$BB_PIX_CLIENT_ID
            BB_PIX_CLIENT_SECRET=$BB_PIX_CLIENT_SECRET
            BB_PIX_DEV_APP_KEY=$BB_PIX_DEV_APP_KEY
            BB_PIX_CERT_PATH=/app/secrets/bb-pix.crt
            BB_PIX_KEY_PATH=/app/secrets/bb-pix.key
            BB_PIX_CHAVE=$BB_PIX_CHAVE
            BB_PIX_BASE_URL=$BB_PIX_BASE_URL
            BB_PIX_OAUTH_URL=$BB_PIX_OAUTH_URL
            PIX_WEBHOOK_TOKEN=$PIX_WEBHOOK_TOKEN
            PUBLIC_BASE_URL=$PUBLIC_BASE_URL
            IMMEDIATE_PRICE_30_CENTS=$IMMEDIATE_PRICE_30_CENTS
            IMMEDIATE_PRICE_50_CENTS=$IMMEDIATE_PRICE_50_CENTS
            IMMEDIATE_OFFER_TIMEOUT_SECONDS=$IMMEDIATE_OFFER_TIMEOUT_SECONDS
            IMMEDIATE_PAYMENT_TIMEOUT_SECONDS=$IMMEDIATE_PAYMENT_TIMEOUT_SECONDS
            IMMEDIATE_ROOM_GRACE_MINUTES=$IMMEDIATE_ROOM_GRACE_MINUTES
            DAILY_API_KEY=$DAILY_API_KEY
            EOF
            sed -i 's/^[[:space:]]*//' .env

            echo "Starting deployment..."
            docker compose build
            docker compose stop api worker
            docker stop whatsapp-chatbot 2>/dev/null || true
            docker compose up -d redis postgres
            docker compose run --rm migrate
            docker compose run --rm --no-deps api python -m app.migrate_queues
            docker compose up -d --remove-orphans api worker

            docker compose ps
            echo "Finished!"

  matching:
    name: Deploy matching after chatbot migrations
    needs: deploy
    uses: ./.github/workflows/matching.yml
    with:
      ref: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit
