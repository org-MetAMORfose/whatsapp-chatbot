name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    name: Build, Lint and Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_DB: chatbot
          POSTGRES_USER: chatbot
          POSTGRES_PASSWORD: test-only-password
        ports: ['15432:5432']
        options: >-
          --health-cmd "pg_isready -U chatbot -d chatbot"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['16379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHON_DOTENV_DISABLED: '1'
      DELIVERY_TEST_DATABASE_URL: postgresql+psycopg://chatbot:test-only-password@localhost:15432/chatbot
      DELIVERY_TEST_REDIS_URL: redis://localhost:16379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --frozen --dev
      - run: uv run ruff check .
      - run: uv run mypy .
      - run: uv run pytest -q
      - name: Prepare isolated smoke configuration
        run: |
          cat > .env <<'CONFIG'
          POSTGRES_USER=chatbot
          POSTGRES_PASSWORD=test-only-password
          REDIS_PASSWORD=test-only-password
          REDIS_HOST=redis
          DATABASE_URL=postgresql+psycopg://chatbot:test-only-password@postgres:5432/chatbot
          LOKI_ENABLED=false
          CONFIG
      - name: Build and start API and worker
        run: docker compose up -d --build --wait
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Shutdown
        if: always()
        run: docker compose down -v
